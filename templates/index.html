<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Scraper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1DB954 0%, #191414 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #191414;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        .nav-links {
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
        }
        
        .nav-links a {
            color: #1DB954;
            text-decoration: none;
            padding: 10px 20px;
            border: 2px solid #1DB954;
            border-radius: 25px;
            transition: all 0.3s;
        }
        
        .nav-links a:hover {
            background: #1DB954;
            color: white;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #1DB954;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: monospace;
        }
        
        .help-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        
        button {
            background: #1DB954;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
        }
        
        button:hover {
            background: #1ed760;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(29, 185, 84, 0.3);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1DB954;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Spotify Scraper</h1>
        <p class="subtitle">One-click Spotify data collection</p>
        
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/dashboard">Dashboard</a>
        </div>
        
        <div class="input-group">
            <label for="playlistId">Playlist ID (Optional)</label>
            <input type="text" id="playlistId" placeholder="Enter Spotify playlist ID">
            <p class="help-text">Leave empty to use default playlist from settings</p>
        </div>
        
        <div class="input-group">
            <label for="trackIds">Track IDs (Optional)</label>
            <textarea id="trackIds" placeholder="Enter track IDs, one per line or comma-separated"></textarea>
            <p class="help-text">Example: 3n3Ppam7vgaVa1iaRUc9Lp, 7qiZfU4dY1lWllzX7mPBI</p>
        </div>
        
        <button id="scrapeBtn" onclick="startScrape()">
            🚀 Start Scraping
        </button>
        
        <div id="status" class="status"></div>
    </div>
    
    <script>
        async function startScrape() {
            const btn = document.getElementById('scrapeBtn');
            const status = document.getElementById('status');
            const playlistId = document.getElementById('playlistId').value.trim();
            const trackIdsInput = document.getElementById('trackIds').value.trim();
            
            // Parse track IDs
            let trackIds = [];
            if (trackIdsInput) {
                trackIds = trackIdsInput.split(/[\n,]/).map(id => id.trim()).filter(id => id);
            }
            
            // Show loading
            btn.disabled = true;
            status.className = 'status loading';
            status.style.display = 'block';
            status.innerHTML = '<span class="loader"></span>Scraping data from Spotify...';
            
            try {
                const response = await fetch('/api/scrape', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        playlist_id: playlistId || null,
                        track_ids: trackIds.length > 0 ? trackIds : null
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    status.className = 'status success';
                    status.innerHTML = `✅ ${data.message}<br><small>Scraped ${data.data.length} tracks successfully!</small>`;
                } else {
                    status.className = 'status error';
                    status.innerHTML = `❌ Error: ${data.message}`;
                }
            } catch (error) {
                status.className = 'status error';
                status.innerHTML = `❌ Error: ${error.message}`;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
